name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: notes
          POSTGRES_DB: notes
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U notes -d notes"
          --health-interval 2s --health-timeout 3s --health-retries 30
      imap:
        image: greenmail/standalone:2.1.3
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=notes:demo-password@example.com -Dgreenmail.users.login=email
        ports: ['3143:3143']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Wait for the IMAP server
        run: timeout 60 bash -c 'until (echo > /dev/tcp/127.0.0.1/3143) 2>/dev/null; do sleep 1; done'
      - run: npm run test:integration

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose demo, end to end
        run: KEEP=0 scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs
