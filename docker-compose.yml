# The whole demo: a throwaway IMAP server, Postgres, the sync service, and a
# seeder that plays the phone. Everything is local and every account is fake.
#
#   docker compose up --build        then open http://localhost:8080
#
name: phone-notes-sync

x-imap-account: &imap-account
  IMAP_HOST: imap
  IMAP_PORT: "3143"
  IMAP_SECURE: "false"
  IMAP_USER: notes@example.com
  IMAP_PASSWORD: demo-password
  NOTES_MAILBOX: Notes

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    ports:
      - "127.0.0.1:${PG_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 2s
      timeout: 3s
      retries: 30

  # GreenMail: an in-memory mail server built for tests. It speaks IMAP with
  # IDLE and UIDPLUS, which is all this service needs from iCloud or Gmail.
  imap:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=notes:demo-password@example.com
        -Dgreenmail.users.login=email
    ports:
      - "127.0.0.1:${IMAP_PORT:-3143}:3143"

  app:
    build: .
    environment:
      <<: *imap-account
      DATABASE_URL: postgres://notes:notes@postgres:5432/notes
      WEB_PORT: "8080"
      RESYNC_INTERVAL_MS: "60000"
      RECONNECT_MAX_MS: "4000"
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      imap:
        condition: service_started

  # Plays the phone: writes notes, then edits and deletes some of them.
  # Run it again any time with: docker compose run --rm seed
  seed:
    build: .
    command: ["node", "dist/scripts/seed.js"]
    environment:
      <<: *imap-account
      SEED_STEP_MS: "${SEED_STEP_MS:-2000}"
    depends_on:
      app:
        condition: service_healthy
    restart: "no"
